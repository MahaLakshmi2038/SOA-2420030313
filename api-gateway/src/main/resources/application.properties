spring.application.name=api-gateway
server.port=8080

# Eureka Service Registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Discover microservices through Eureka
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# Event Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=event-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://EVENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/events/**

# Volunteer Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=volunteer-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://VOLUNTEER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/volunteers/**

# Assignment Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=assignment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ASSIGNMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/assignments/**

# Notification Service Route
spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/notifications/**